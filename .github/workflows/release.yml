name: Release (Windows)

on:
  push:
    branches: ["claude/claude-credit-monitor-dashboard-vjmzxk"]
    # Změny čistě v dokumentaci nemá smysl přebalovat.
    paths-ignore: ["README.md", "NOTICE", "LICENSE", "build/preview-*.png"]
  # Ruční spuštění funguje jen pro workflow na výchozí větvi; tady je hlavně
  # pro případ, že se projekt přesune do vlastního repozitáře.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Typecheck, testy a build
        run: |
          npm run typecheck
          npm test
          npx electron-vite build

      - name: Sestavení instalátoru
        # Bez podpisu — v repozitáři nejsou žádné podepisovací certifikáty.
        run: npx electron-builder --win --publish never

      - name: Výpis výsledků
        run: Get-ChildItem release -File | Select-Object Name, Length
        shell: pwsh

      # Artefakt slouží jako záloha, když by publikace release neprošla.
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeMonitor-windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      # Tag i release zakládá workflow sám přes GITHUB_TOKEN — push tagu zvenčí
      # nemusí být povolený, tohle na tom nezávisí.
      - name: Publikace release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "claudemonitor-v$version"

          $notes = @"
          Widget na Windows plochu pro sledování limitů Claude účtů.

          - **setup.exe** — instalace do %LOCALAPPDATA%, bez práv správce, se zástupcem
            ve Start menu (podmínka pro funkční toast notifikace).
          - **portable.exe** — spustí se odkudkoli, notifikace přes tray balloon.

          Aplikace není podepsaná, takže při prvním spuštění vyskočí SmartScreen:
          *Další informace* -> *Přesto spustit*.

          Sestaveno z commitu $env:GITHUB_SHA.
          "@

          # Předchozí release stejné verze nahradíme, ať odkaz zůstává stabilní.
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag (Get-ChildItem release/*.exe).FullName `
            --title "ClaudeMonitor $version" `
            --notes $notes `
            --target $env:GITHUB_SHA

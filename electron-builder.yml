appId: com.petrmb.claudemonitor
productName: ClaudeMonitor
directories:
  output: release
  buildResources: build
# LZMA na maximum — build je pomalejší, výsledný .exe menší.
compression: maximum
# Vyhazuje nepoužité jazykové .pak soubory a licenční texty Chromia.
afterPack: build/afterPack.js
files:
  - out/**
  - package.json
extraResources:
  - from: build
    to: build
    filter:
      - "*.ico"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # ZIP je rozbalená aplikace bez jakéhokoli samorozbalovacího obalu.
    # Portable .exe je 7z SFX, který se při každém spuštění rozbalí do %TEMP%
    # a odtud se spustí — a přesně tenhle vzorec je pro firemní EDR podezřelý.
    # ZIP tenhle problém nemá: rozbalíš jednou a spouštíš normální .exe.
    - target: zip
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: true
  # per-user instalace do %LOCALAPPDATA% — nevyžaduje admin práva
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  # Zástupce ve Start menu je PODMÍNKA pro Windows toast notifikace
  createStartMenuShortcut: true
  shortcutName: ClaudeMonitor
  artifactName: ClaudeMonitor-${version}-setup.exe
portable:
  artifactName: ClaudeMonitor-${version}-portable.exe
  unpackDirName: ClaudeMonitor
